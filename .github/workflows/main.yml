name: Equiteez Indexer CI

on:
  push:
    branches:
      - 'main'
      - 'new-contracts'
      - 'feature/new-contracts-migration'
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - 'main'
      - 'new-contracts'
      - 'feature/new-contracts-migration'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate indexer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rwa-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: equiteez-indexer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Lint and format
        run: |
          docker run --rm --entrypoint ruff -v "$GITHUB_WORKSPACE:/workspace" -w /workspace equiteez-indexer:ci check .
          docker run --rm --entrypoint ruff -v "$GITHUB_WORKSPACE:/workspace" -w /workspace equiteez-indexer:ci format --check .
      - name: Unit tests
        run: >
          docker run --rm --entrypoint python
          -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          equiteez-indexer:ci -m unittest discover -s tests -v
      - name: Supply PostgreSQL integration tests
        run: >
          docker run --rm --network host --entrypoint python
          -e RWA_TEST_DATABASE_URL=postgres://postgres:rwa-test@127.0.0.1:5432/postgres
          -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          equiteez-indexer:ci -m unittest tests.test_rwa_supply -v
      - name: Regenerate types
        run: >
          docker run --rm --entrypoint dipdup
          -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          equiteez-indexer:ci
          -c dipdup.local.yml -c dipdup.contracts.yml -c dipdup.types.yml init -f
      - name: Fail on stale committed types
        run: |
          if ! git diff --quiet -- equiteez/types/; then
            echo "::error::Generated types differ from committed ones — run 'yarn init-types' and commit equiteez/types/."
            git diff --stat -- equiteez/types/
            exit 1
          fi
      - name: Validate configuration
        run: >
          docker run --rm --entrypoint dipdup
          -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          equiteez-indexer:ci
          -c dipdup.local.yml -c dipdup.contracts.yml -c dipdup.types.yml -c dipdup.yml
          config export > /dev/null

  image:
    name: Build indexer image
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_REGISTRY: ghcr.io
      DOCKER_IMAGE_BASE: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BASE }}
      - name: Build (push on non-PR)
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
