name: Equiteez Indexer CI

on:
  push:
    branches:
      - 'main'
      - 'new-contracts'
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - 'main'
      - 'new-contracts'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12.4'
  POETRY_VERSION: '1.8.4'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --only main
      - name: ruff check
        run: poetry run ruff check .
      - name: ruff format --check
        run: poetry run ruff format --check .

  types:
    name: init-types (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --only main
      - name: Regenerate types (yarn init-types)
        run: >
          poetry run dipdup
          -c dipdup.local.yml -c dipdup.contracts.yml -c dipdup.types.yml
          init -f
      - name: Fail on stale committed types
        run: |
          if ! git diff --quiet -- equiteez/types/; then
            echo "::error::Generated types differ from committed ones — run 'yarn init-types' and commit equiteez/types/."
            git diff --stat -- equiteez/types/
            exit 1
          fi
          echo "Committed types are up to date."

  config:
    name: config validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --only main
      - name: dipdup config export
        run: >
          poetry run dipdup
          -c dipdup.local.yml -c dipdup.contracts.yml -c dipdup.types.yml -c dipdup.yml
          config export > /dev/null

  image:
    name: Build indexer image
    runs-on: ubuntu-latest
    needs: [lint, types, config]
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_REGISTRY: ghcr.io
      DOCKER_IMAGE_BASE: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_BASE }}
      - name: Build (push on non-PR)
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
